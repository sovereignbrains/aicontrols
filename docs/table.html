<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Исходники AIControls</title>
<style>
@font-face{font-family:Geist;src:url(../assets/fonts/Geist.ttf)}
@font-face{font-family:JBM;src:url(../assets/fonts/JetBrainsMono.ttf)}
:root{--bg:#121213;--card:#18181a;--raised:#232327;--line:#2c2c31;--fg:#f2f4f8;--dim:#9c9ea4;--accent:#4c92ff;--good:#4cd27a;--bad:#f06060}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.45 Geist,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:16px;font-weight:600;margin:0 12px 0 0}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;width:220px;font:inherit;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.chip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;font-size:12.5px}
.chip.on{background:#1d2738;border-color:var(--accent);color:var(--fg)}
label{color:var(--dim);font-size:12.5px;display:flex;gap:6px;align-items:center}
button{background:var(--raised);border:0;color:var(--fg);border-radius:6px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button:hover{background:#2e2e33}
.wrap{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;min-width:100%;white-space:nowrap}
thead th{position:sticky;background:var(--bg);z-index:2;color:var(--dim);font-weight:500;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
thead tr:first-child th{top:0;height:28px;text-align:center;color:#c4c6cc;border-bottom:1px solid var(--line)}
thead tr:first-child th+th{border-left:1px solid var(--line)}
thead tr:nth-child(2) th{top:28px;cursor:pointer;user-select:none}
thead tr:nth-child(2) th:hover{color:var(--fg)}
th.num,td.num{text-align:right;font-family:JBM,Consolas,monospace;font-size:12.5px}
th .arrow{display:inline-block;width:10px;color:var(--accent)}
td{padding:5px 10px;border-bottom:1px solid #1e1e21}
th.first{left:0;z-index:3}
td.first{position:sticky;left:0;background:var(--bg);z-index:1;font-family:JBM,Consolas,monospace;font-size:12.5px}
tbody tr.row:hover td{background:var(--card)}
tbody tr.row.sel td{background:#1d2738}
tr.group td{background:var(--card);color:#c4c6cc;font-weight:600;cursor:pointer;position:sticky;top:57px;z-index:1}
tr.group td.first{z-index:2}
tr.group .fold{display:inline-block;width:14px;color:var(--dim);transition:transform .15s}
tr.group.closed .fold{transform:rotate(-90deg)}
tr.group .n{color:var(--dim);font-weight:400;margin-left:6px}
.bar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.85}
.heat{border-radius:4px;padding:1px 6px}
.add{color:var(--good)}.del{color:var(--bad)}
.ext{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
tfoot td{position:sticky;bottom:0;background:var(--raised);font-weight:600;border-top:1px solid var(--line)}
tfoot td.first{background:var(--raised)}
.hide{display:none}
#status{color:var(--dim);font-size:12.5px;margin-left:auto}
</style></head><body>
<header>
 <h1>Исходники AIControls</h1>
 <input type="search" id="q" placeholder="Фильтр по пути…">

 <label>от <input type="range" id="min" min="0" max="1000" step="10" value="0"> <span id="minv">0</span> строк</label>
 <label><input type="checkbox" id="grouped" checked> по папкам</label>
 <button id="copy">Копировать TSV</button>
 <span id="status"></span>
</header>

</thead>
<tbody id="body"></tbody>
<tfoot><tr id="foot"></tr></tfoot>
</table></div>

const COLS = [
  {k:'f',     t:'Файл',          cls:'first'},
  {k:'lines', t:'Строк',         num:1, bar:1},
  {k:'kb',    t:'КБ',            num:1, fmt:v => v.toFixed(1)},
  {k:'share', t:'Доля',          num:1, fmt:v => (v*100).toFixed(1)+'%'},
  {k:'commits',t:'Коммитов',     num:1, heat:1},
  {k:'first', t:'Создан'},
  {k:'last',  t:'Изменён'},
  {k:'add',   t:'+',             num:1, cls2:'add'},

];
const total = DATA.reduce((s, r) => s + r.lines, 0);
DATA.forEach(r => { r.share = r.lines / total; r.churn = r.lines ? (r.add + r.del) / r.lines : 0; r.dir = r.dir || '.'; });
const maxLines = Math.max(...DATA.map(r => r.lines)), maxCommits = Math.max(...DATA.map(r => r.commits));
const st = {sort:'lines', up:false, q:'', exts:new Set(), min:0, grouped:true, closed:new Set(), sel:null};

$('#cols').innerHTML = COLS.map(c => `<th class="${c.num?'num ':''}${c.cls||''}" data-k="${c.k}">${c.t}<span class="arrow"></span></th>`).join('');

$('#exts').innerHTML = exts.map(e => `<span class="chip" data-e="${e}">.${e}</span>`).join(' ');
$('#min').max = Math.ceil(maxLines / 10) * 10;

function cell(c, r) {
  const v = r[c.k];
  if (c.k === 'f') return `<td class="first">${r.f.slice(r.dir === '.' ? 0 : r.dir.length + 1)}<span class="ext">${r.ext}</span></td>`;
  let html = c.fmt ? c.fmt(v) : String(v);
  if (c.bar) html = `<span class="bar"><i style="width:${Math.max(2, 80 * v / maxLines)}px"></i>${v}</span>`;
  if (c.heat) html = `<span class="heat" style="background:rgba(76,146,255,${(0.08 + 0.6 * v / maxCommits).toFixed(2)})">${v}</span>`;
  return `<td class="${c.num?'num ':''}${c.cls2||''}">${html}</td>`;
}
function sum(rows) {
  const s = {f:'', lines:0, kb:0, share:0, commits:0, add:0, del:0, first:'', last:''};
  for (const r of rows) { for (const k of ['lines','kb','share','commits','add','del']) s[k] += r[k];
    if (!s.first || r.first < s.first) s.first = r.first; if (r.last > s.last) s.last = r.last; }
  s.churn = s.lines ? (s.add + s.del) / s.lines : 0;
  return s;
}
function visible() {
  return DATA.filter(r => r.f.toLowerCase().includes(st.q) && (!st.exts.size || st.exts.has(r.ext)) && r.lines >= st.min)
    .sort((a, b) => { const x = a[st.sort], y = b[st.sort];
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * (st.up ? 1 : -1); });
}
function render() {
  const rows = visible();
  let html = '';
  if (st.grouped) {
    const groups = new Map();
    rows.forEach(r => { if (!groups.has(r.dir)) groups.set(r.dir, []); groups.get(r.dir).push(r); });
    const order = [...groups.keys()].sort((a, b) => sum(groups.get(b)).lines - sum(groups.get(a)).lines);
    for (const d of order) {
      const g = groups.get(d), s = sum(g), closed = st.closed.has(d);
      html += `<tr class="group${closed?' closed':''}" data-d="${d}"><td class="first"><span class="fold">▾</span>${d}/<span class="n">${g.length}</span></td>`
            + COLS.slice(1).map(c => cell(c, s)).join('') + '</tr>';
      if (!closed) html += g.map(r => `<tr class="row${st.sel===r.f?' sel':''}" data-f="${r.f}">` + COLS.map(c => cell(c, r)).join('') + '</tr>').join('');
    }
  } else {
    html = rows.map(r => `<tr class="row${st.sel===r.f?' sel':''}" data-f="${r.f}">` + COLS.map(c => cell(c, {...r, dir:'.'})).join('') + '</tr>').join('');
  }
  $('#body').innerHTML = html;
  const s = sum(rows);
  $('#foot').innerHTML = `<td class="first">Итого: ${rows.length} из ${DATA.length}</td>` + COLS.slice(1).map(c => cell(c, s)).join('');
  document.querySelectorAll('#cols th').forEach(th => th.querySelector('.arrow').textContent = th.dataset.k === st.sort ? (st.up ? '▲' : '▼') : '');
  document.querySelectorAll('#exts .chip').forEach(ch => ch.classList.toggle('on', st.exts.has(ch.dataset.e)));
  $('#status').textContent = st.sel ? st.sel : 'клик — выделить строку, ↑/↓ — по строкам';
}
$('#cols').onclick = e => { const th = e.target.closest('th'); if (!th) return;
  if (st.sort === th.dataset.k) st.up = !st.up; else { st.sort = th.dataset.k; st.up = !COLS.find(c => c.k === th.dataset.k).num; } render(); };
$('#exts').onclick = e => { const e2 = e.target.dataset.e; if (!e2) return; st.exts.has(e2) ? st.exts.delete(e2) : st.exts.add(e2); render(); };
$('#q').oninput = e => { st.q = e.target.value.toLowerCase(); render(); };
$('#min').oninput = e => { st.min = +e.target.value; $('#minv').textContent = st.min; render(); };
$('#grouped').onchange = e => { st.grouped = e.target.checked; render(); };
$('#body').onclick = e => { const g = e.target.closest('tr.group'), r = e.target.closest('tr.row');
  if (g) { const d = g.dataset.d; st.closed.has(d) ? st.closed.delete(d) : st.closed.add(d); }
  if (r) st.sel = st.sel === r.dataset.f ? null : r.dataset.f;
  render(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !['ArrowUp','ArrowDown'].includes(e.key)) return;
  const list = [...document.querySelectorAll('tr.row')].map(r => r.dataset.f); if (!list.length) return;
  const i = list.indexOf(st.sel); st.sel = list[Math.max(0, Math.min(list.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  e.preventDefault(); render(); document.querySelector('tr.row.sel')?.scrollIntoView({block:'nearest'}); });
$('#copy').onclick = () => {
  const tsv = [COLS.map(c => c.t).join('\t'), ...visible().map(r => COLS.map(c => c.fmt ? c.fmt(r[c.k]) : r[c.k]).join('\t'))].join('\n');
  navigator.clipboard.writeText(tsv).then(() => { $('#status').textContent = 'Скопировано: ' + visible().length + ' строк'; }); };
render();
</script>
</body></html>
